<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyFlow AI Planner</title>

<style>

:root{
  --bg1:#0f172a;
  --bg2:#1e293b;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --text:white;
  --muted:rgba(255,255,255,0.6);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:
  linear-gradient(
    135deg,
    var(--bg1),
    var(--bg2)
  );

  color:white;
  overflow:hidden;
}

/* TOPBAR */

.topbar{
  height:80px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 24px;

  border-bottom:
  1px solid rgba(255,255,255,0.08);

  background:
  rgba(15,23,42,0.82);

  backdrop-filter:blur(20px);
}

.logo{
  font-size:2rem;
  font-weight:800;
}

.subtitle{
  color:var(--muted);
  margin-top:4px;
  font-size:0.9rem;
}

.today{
  text-align:right;
}

/* MAIN */

.main{
  display:grid;
  grid-template-columns:360px 1fr;

  height:calc(100vh - 80px);
}

/* SIDEBAR */

.sidebar{
  overflow-y:auto;
  padding:20px;

  border-right:
  1px solid rgba(255,255,255,0.08);
}

.card{
  background:var(--card);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:24px;

  padding:20px;

  margin-bottom:20px;

  backdrop-filter:blur(20px);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.25);
}

.section-title{
  font-size:1.1rem;
  font-weight:700;
  margin-bottom:16px;
}

/* INPUTS */

input,
select{
  width:100%;

  padding:14px;

  border:none;

  border-radius:16px;

  margin-bottom:12px;

  color:white;

  background:
  rgba(255,255,255,0.08);

  font-size:0.95rem;
}

input::placeholder{
  color:rgba(255,255,255,0.45);
}

select{
  appearance:none;

  background:
    linear-gradient(
      135deg,
      rgba(59,130,246,0.18),
      rgba(139,92,246,0.18)
    );

  cursor:pointer;

  font-weight:600;
}

option{
  background:#0f172a;
  color:white;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:0.85rem;
  color:rgba(255,255,255,0.7);
}

/* BUTTON */

button{
  width:100%;

  border:none;

  padding:14px;

  border-radius:16px;

  background:
  linear-gradient(
    90deg,
    #3b82f6,
    #8b5cf6
  );

  color:white;

  font-weight:700;

  cursor:pointer;

  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
}

/* MAJOR ASSIGNMENT */

#majorAssignmentBanner{
  margin:20px;

  padding:20px;

  border-radius:24px;

  background:
  linear-gradient(
    135deg,
    rgba(239,68,68,0.22),
    rgba(139,92,246,0.22)
  );

  border:
  1px solid rgba(255,255,255,0.08);

  backdrop-filter:blur(20px);
}

/* WEEK VIEW */

.week-container{
  overflow-x:auto;
  overflow-y:hidden;

  padding:20px;
}

.week-grid{
  display:grid;

  grid-template-columns:
  repeat(5,320px);

  gap:18px;

  min-width:max-content;
}

/* DAY */

.day{
  background:
  rgba(255,255,255,0.05);

  border-radius:24px;

  overflow-y:auto;

  height:calc(100vh - 240px);

  border:
  1px solid rgba(255,255,255,0.08);

  position:relative;
}

.today-day{
  border:
  2px solid #8b5cf6;
}

/* HEADER */

.day-header{
  position:sticky;

  top:0;

  z-index:100;

  background:
  rgba(15,23,42,0.96);

  padding:18px;

  border-bottom:
  1px solid rgba(255,255,255,0.08);

  backdrop-filter:blur(20px);
}

.day-name{
  font-size:1.15rem;
  font-weight:700;
}

.ab-day{
  color:#60a5fa;
  margin-top:5px;
}

/* TIMELINE */

.timeline{
  position:relative;
}

/* HOURS */

.hour-row{
  height:80px;

  border-bottom:
  1px solid rgba(255,255,255,0.06);

  position:relative;
}

.hour-label{
  position:absolute;

  left:12px;
  top:10px;

  font-size:0.75rem;

  color:rgba(255,255,255,0.4);

  font-weight:700;
}

.hour-line{
  position:absolute;

  left:70px;
  right:0;
  top:40px;

  height:1px;

  background:
  rgba(255,255,255,0.05);
}

/* EVENTS */

.event{
  position:absolute;

  left:80px;
  right:12px;

  border-radius:18px;

  padding:10px;

  overflow:hidden;

  border:
  1px solid rgba(255,255,255,0.08);

  box-shadow:
  0 8px 25px rgba(0,0,0,0.25);
}

.class-event{
  background:
  linear-gradient(
    135deg,
    rgba(59,130,246,0.92),
    rgba(99,102,241,0.92)
  );
}

.homework-event{
  background:
  linear-gradient(
    135deg,
    rgba(16,185,129,0.92),
    rgba(5,150,105,0.92)
  );
}

.test-event{
  background:
  linear-gradient(
    135deg,
    rgba(239,68,68,0.95),
    rgba(220,38,38,0.95)
  );
}

.busy-event{
  background:
  linear-gradient(
    135deg,
    rgba(245,158,11,0.95),
    rgba(217,119,6,0.95)
  );
}

.event-title{
  font-weight:700;
  font-size:0.9rem;
}

.event-sub{
  font-size:0.72rem;
  opacity:0.85;
  margin-top:4px;
}

/* SETUP */

.setup{
  position:fixed;

  inset:0;

  background:#020617;

  z-index:9999;

  overflow:auto;

  padding:40px;
}

.setup-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.hidden{
  display:none;
}

@media(max-width:1100px){

  body{
    overflow:auto;
  }

  .main{
    grid-template-columns:1fr;
    height:auto;
  }

}

</style>
</head>

<body>

<!-- SETUP -->

<div class="setup hidden" id="setup">

  <h1 style="margin-bottom:10px;">
    Setup Your Schedule
  </h1>

  <div class="subtitle" style="margin-bottom:30px;">
    Configure your A Day and B Day classes.
  </div>

  <div class="setup-grid">

    <div class="card">

      <div class="section-title">
        A Day
      </div>

      <select id="a1"></select>
      <select id="a2"></select>
      <select id="a3"></select>
      <select id="a4"></select>

    </div>

    <div class="card">

      <div class="section-title">
        B Day
      </div>

      <select id="b1"></select>
      <select id="b2"></select>
      <select id="b3"></select>
      <select id="b4"></select>

    </div>

  </div>

  <div style="margin-top:20px;">
    <button onclick="saveSchedule()">
      Finish Setup
    </button>
  </div>

</div>

<!-- TOPBAR -->

<div class="topbar">

  <div>

    <div class="logo">
      StudyFlow
    </div>

    <div class="subtitle">
      AI Homework Planner
    </div>

  </div>

  <div class="today" id="todayText"></div>

</div>

<!-- MAJOR ASSIGNMENT -->

<div id="majorAssignmentBanner"></div>

<!-- MAIN -->

<div class="main">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="card">

      <div class="section-title">
        Add Assignment
      </div>

      <input
        id="title"
        placeholder="Assignment Title"
      >

      <select id="class"></select>

      <select id="type" onchange="updateDateFields()">
        <option>Homework</option>
        <option>Project</option>
        <option>Essay</option>
        <option>Quiz</option>
        <option>Test</option>
        <option>Studying</option>
        <option>Other</option>
      </select>

      <div id="assignedWrapper">

        <label>Assigned Date</label>

        <input
          type="date"
          id="assigned"
        >

      </div>

      <label>Due Date</label>

      <input
        type="date"
        id="due"
      >

      <input
        type="number"
        id="hours"
        placeholder="Estimated Hours"
      >

      <button onclick="addAssignment()">
        Add Assignment
      </button>

    </div>

    <div class="card">

      <div class="section-title">
        Add Busy Time
      </div>

      <input
        id="busyTitle"
        placeholder="Activity"
      >

      <select id="repeat">
        <option>One Time</option>
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <label>Day</label>

      <input
        type="date"
        id="busyDate"
      >

      <label>Start Time</label>

      <input
        type="time"
        id="busyStart"
      >

      <label>End Time</label>

      <input
        type="time"
        id="busyEnd"
      >

      <button onclick="addBusy()">
        Add Busy Time
      </button>

    </div>

  </div>

  <!-- WEEK -->

  <div class="week-container">

    <div class="week-grid" id="weekGrid">

    </div>

  </div>

</div>

<script>

const classes = [
  "Math",
  "English",
  "History",
  "Theatre",
  "Spanish",
  "Health/Fitness",
  "Elective",
  "Science",
  "Study Hall",
  "Other"
];

const classTimes = [

  {
    start:8,
    end:9.38,
    label:"8:00 - 9:23"
  },

  {
    start:9.38,
    end:10.83,
    label:"9:23 - 10:50"
  },

  {
    start:12,
    end:13.38,
    label:"12:00 - 1:23"
  },

  {
    start:13.38,
    end:14.83,
    label:"1:23 - 2:50"
  }

];

let assignments =
JSON.parse(
localStorage.getItem("assignments")
) || [];

let busy =
JSON.parse(
localStorage.getItem("busy")
) || [];

let schedule =
JSON.parse(
localStorage.getItem("schedule")
);

/* POPULATE */

const classDropdown =
document.getElementById("class");

classes.forEach(c=>{

  classDropdown.innerHTML += `
    <option>${c}</option>
  `;

});

[
"a1","a2","a3","a4",
"b1","b2","b3","b4"
].forEach(id=>{

  const el =
  document.getElementById(id);

  classes.forEach(c=>{

    el.innerHTML += `
      <option>${c}</option>
    `;

  });

});

/* SETUP */

if(!schedule){

  document
  .getElementById("setup")
  .classList.remove("hidden");

}

function saveSchedule(){

  schedule = {

    A:[
      a1.value,
      a2.value,
      a3.value,
      a4.value
    ],

    B:[
      b1.value,
      b2.value,
      b3.value,
      b4.value
    ]
  };

  localStorage.setItem(
    "schedule",
    JSON.stringify(schedule)
  );

  document
  .getElementById("setup")
  .classList.add("hidden");

  renderWeek();

}

/* HOMEWORK ONLY ASSIGNED DATE */

function updateDateFields(){

  const type =
  document.getElementById("type").value;

  const assignedWrapper =
  document.getElementById(
    "assignedWrapper"
  );

  assignedWrapper.style.display =
  type === "Homework"
  ? "block"
  : "none";

}

/* ADD ASSIGNMENT */

function addAssignment(){

  const type =
  document.getElementById("type").value;

  assignments.push({

    id:Date.now(),

    title:title.value,

    className:
    document.getElementById("class").value,

    type:type,

    assigned:
    type === "Homework"
    ? assigned.value
    : null,

    due:due.value,

    hours:
    hours.value || 1

  });

  localStorage.setItem(
    "assignments",
    JSON.stringify(assignments)
  );

  title.value = "";
  hours.value = "";

  renderWeek();

}

/* ADD BUSY */

function addBusy(){

  busy.push({

    id:Date.now(),

    title:busyTitle.value,

    repeat:repeat.value,

    date:busyDate.value,

    start:busyStart.value,

    end:busyEnd.value

  });

  localStorage.setItem(
    "busy",
    JSON.stringify(busy)
  );

  busyTitle.value = "";

  renderWeek();

}

/* SCHOOL DAYS */

function getSchoolDayIndex(date){

  let start =
  new Date();

  start.setHours(0,0,0,0);

  let current =
  new Date(start);

  let count = 0;

  while(current < date){

    current.setDate(
      current.getDate()+1
    );

    if(
      current.getDay() !== 0 &&
      current.getDay() !== 6
    ){

      count++;

    }

  }

  return count;

}

function getABDay(date){

  return getSchoolDayIndex(date)%2===0
  ? "A"
  : "B";

}

function hourToPixels(hour){

  return (hour-8)*80;

}

/* MAJOR ASSIGNMENT */

function renderMajorAssignment(){

  const banner =
  document.getElementById(
    "majorAssignmentBanner"
  );

  const major =
  assignments
  .filter(a=>

    a.type === "Project" ||
    a.type === "Essay" ||
    a.type === "Test"

  )
  .sort((a,b)=>

    new Date(a.due) -
    new Date(b.due)

  )[0];

  if(!major){

    banner.innerHTML = `
      <div style="font-weight:700;">
        No Major Assignments
      </div>
    `;

    return;

  }

  banner.innerHTML = `

    <div
      style="
        font-size:0.8rem;
        opacity:0.7;
        margin-bottom:8px;
        font-weight:700;
      "
    >
      NEXT MAJOR ASSIGNMENT
    </div>

    <div
      style="
        font-size:1.5rem;
        font-weight:800;
      "
    >
      ${major.title}
    </div>

    <div
      style="
        margin-top:8px;
        opacity:0.8;
      "
    >
      ${major.className}
      •
      ${major.type}
    </div>

    <div
      style="
        margin-top:6px;
        color:#fca5a5;
        font-weight:700;
      "
    >
      Due ${major.due}
    </div>

  `;

}

/* WEEK */

function renderWeek(){

  renderMajorAssignment();

  const grid =
  document.getElementById("weekGrid");

  grid.innerHTML = "";

  let monday =
  new Date();

  while(monday.getDay() !== 1){

    monday.setDate(
      monday.getDate()-1
    );

  }

  for(let i=0;i<5;i++){

    const date =
    new Date(monday);

    date.setDate(
      monday.getDate()+i
    );

    const ab =
    getABDay(date);

    const day =
    document.createElement("div");

    day.className = "day";

    if(
      date.toDateString() ===
      new Date().toDateString()
    ){

      day.classList.add(
        "today-day"
      );

    }

    day.innerHTML = `

      <div class="day-header">

        <div class="day-name">
          ${date.toLocaleDateString(
            "en-US",
            {weekday:"long"}
          )}
        </div>

        <div class="ab-day">
          ${ab} Day
        </div>

      </div>

      <div class="timeline"></div>

    `;

    grid.appendChild(day);

    const timeline =
    day.querySelector(".timeline");

    /* HOURS */

    for(let h=8; h<=24; h++){

      const row =
      document.createElement("div");

      row.className = "hour-row";

      const label =
      h===24
      ? "12 AM"
      : h>12
      ? `${h-12} PM`
      : `${h} AM`;

      row.innerHTML = `

        <div class="hour-label">
          ${label}
        </div>

        <div class="hour-line"></div>

      `;

      timeline.appendChild(row);

    }

    /* CLASSES */

    (schedule?.[ab] || [])
    .forEach((cls,index)=>{

      const t =
      classTimes[index];

      const block =
      document.createElement("div");

      block.className =
      "event class-event";

      block.style.top =
      `${hourToPixels(t.start)}px`;

      block.style.height =
      `${(t.end-t.start)*80}px`;

      block.innerHTML = `

        <div class="event-title">
          ${cls}
        </div>

        <div class="event-sub">
          ${t.label}
        </div>

      `;

      timeline.appendChild(block);

    });

    /* FLEX LUNCH */

    const lunch =
    document.createElement("div");

    lunch.className =
    "event homework-event";

    lunch.style.top =
    `${hourToPixels(10.83)}px`;

    lunch.style.height =
    `${(12-10.83)*80}px`;

    lunch.innerHTML = `

      <div class="event-title">
        Flex Time / Lunch
      </div>

      <div class="event-sub">
        Homework Opportunity
      </div>

    `;

    timeline.appendChild(lunch);

    /* BUS */

    const bus =
    document.createElement("div");

    bus.className =
    "event homework-event";

    bus.style.top =
    `${hourToPixels(14.83)}px`;

    bus.style.height =
    `${(16-14.83)*80}px`;

    bus.innerHTML = `

      <div class="event-title">
        Bus Ride / Homework
      </div>

      <div class="event-sub">
        Study Opportunity
      </div>

    `;

    timeline.appendChild(bus);

    /* BUSY EVENTS */

    busy.forEach((b,index)=>{

      const currentDate =
      date.toISOString().split("T")[0];

      let shouldShow = false;

      if(b.repeat === "One Time"){

        shouldShow =
        b.date === currentDate;

      }

      else if(b.repeat === "Daily"){

        shouldShow = true;

      }

      else if(b.repeat === "Weekly"){

        shouldShow =
        new Date(b.date).getDay() ===
        date.getDay();

      }

      else if(b.repeat === "Monthly"){

        shouldShow =
        new Date(b.date).getDate() ===
        date.getDate();

      }

      if(!shouldShow) return;

      const startHour =
      parseInt(b.start.split(":")[0]) +
      parseInt(b.start.split(":")[1])/60;

      const endHour =
      parseInt(b.end.split(":")[0]) +
      parseInt(b.end.split(":")[1])/60;

      const block =
      document.createElement("div");

      block.className =
      "event busy-event";

      block.style.top =
      `${hourToPixels(startHour)}px`;

      block.style.height =
      `${(endHour-startHour)*80}px`;

      block.innerHTML = `

        <div class="event-title">
          ${b.title}
        </div>

        <div class="event-sub">
          ${b.start}
          -
          ${b.end}
        </div>

      `;

      timeline.appendChild(block);

    });

    /* ASSIGNMENTS */

    assignments.forEach((a,index)=>{

      if(
        a.due ===
        date
        .toISOString()
        .split("T")[0]
      ){

        const block =
        document.createElement("div");

        let typeClass =
        "homework-event";

        if(
          a.type==="Test" ||
          a.type==="Quiz"
        ){

          typeClass =
          "test-event";

        }

        block.className =
        `event ${typeClass}`;

        const top =
        650 + (index*85);

        block.style.top =
        `${top}px`;

        block.style.height =
        `75px`;

        block.innerHTML = `

          <div class="event-title">
            ${a.title}
          </div>

          <div class="event-sub">
            ${a.className}
            • ${a.type}
          </div>

        `;

        timeline.appendChild(block);

      }

    });

  }

}

/* TOP DATE */

document
.getElementById("todayText")
.innerHTML = `

  ${new Date()
  .toLocaleDateString(
    "en-US",
    {
      weekday:"long",
      month:"long",
      day:"numeric"
    }
  )}

`;

updateDateFields();

if(schedule){

  renderWeek();

}

</script>

</body>
</html>
