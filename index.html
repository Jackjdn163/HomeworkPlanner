<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>StudyFlow AI Planner</title>

<style>

:root{
  --bg1:#0f172a;
  --bg2:#1e293b;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.1);
  --text:white;
  --muted:rgba(255,255,255,0.6);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:
  linear-gradient(
    135deg,
    var(--bg1),
    var(--bg2)
  );

  color:white;

  min-height:100vh;

  overflow:hidden;
}

/* TOP BAR */

.topbar{
  height:80px;

  border-bottom:
  1px solid rgba(255,255,255,0.08);

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 25px;

  background:
  rgba(15,23,42,0.75);

  backdrop-filter:blur(20px);
}

.logo{
  font-size:2rem;
  font-weight:800;
}

.subtitle{
  color:var(--muted);
  font-size:0.9rem;
}

.today{
  text-align:right;
}

/* MAIN */

.main{
  display:grid;
  grid-template-columns:350px 1fr;

  height:calc(100vh - 80px);
}

/* SIDEBAR */

.sidebar{
  border-right:
  1px solid rgba(255,255,255,0.08);

  overflow-y:auto;

  padding:20px;
}

.card{
  background:var(--card);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:24px;

  padding:20px;

  margin-bottom:20px;

  backdrop-filter:blur(20px);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.25);
}

.section-title{
  font-size:1.1rem;
  font-weight:700;
  margin-bottom:15px;
}

/* INPUTS */

input,
select{
  width:100%;

  padding:14px;

  margin-bottom:12px;

  border:none;

  border-radius:16px;

  background:
  rgba(255,255,255,0.08);

  color:white;

  font-size:0.95rem;
}

input::placeholder{
  color:rgba(255,255,255,0.45);
}

/* THEMED SELECT */

select{
  appearance:none;

  background:
    linear-gradient(
      135deg,
      rgba(59,130,246,0.18),
      rgba(139,92,246,0.18)
    );

  cursor:pointer;

  font-weight:600;
}

/* BUTTON */

button{
  width:100%;

  border:none;

  padding:14px;

  border-radius:16px;

  background:
  linear-gradient(
    90deg,
    #3b82f6,
    #8b5cf6
  );

  color:white;

  font-weight:700;

  cursor:pointer;

  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
}

/* WEEK AREA */

.week-container{
  overflow-x:auto;
  overflow-y:hidden;

  padding:20px;
}

.week-grid{
  display:grid;

  grid-template-columns:
  repeat(5,320px);

  gap:18px;

  min-width:max-content;
}

/* DAY */

.day{
  background:
  rgba(255,255,255,0.05);

  border-radius:24px;

  overflow-y:auto;

  height:calc(100vh - 140px);

  border:
  1px solid rgba(255,255,255,0.08);

  position:relative;
}

/* TODAY */

.today-day{
  border:
  2px solid #8b5cf6;
}

/* HEADER */

.day-header{
  position:sticky;

  top:0;

  z-index:100;

  background:
  rgba(15,23,42,0.95);

  backdrop-filter:blur(20px);

  padding:18px;

  border-bottom:
  1px solid rgba(255,255,255,0.08);
}

.day-name{
  font-size:1.2rem;
  font-weight:700;
}

.ab-day{
  color:#60a5fa;
  margin-top:5px;
}

/* TIMELINE */

.timeline{
  position:relative;
}

/* HOUR ROW */

.hour-row{
  height:80px;

  border-bottom:
  1px solid rgba(255,255,255,0.06);

  position:relative;
}

.hour-label{
  position:absolute;

  left:12px;
  top:10px;

  font-size:0.75rem;

  color:rgba(255,255,255,0.4);

  font-weight:700;
}

.hour-line{
  position:absolute;

  left:70px;
  right:0;
  top:40px;

  height:1px;

  background:
  rgba(255,255,255,0.05);
}

/* EVENTS */

.event{
  position:absolute;

  left:80px;
  right:12px;

  border-radius:18px;

  padding:10px;

  overflow:hidden;

  border:
  1px solid rgba(255,255,255,0.08);

  box-shadow:
  0 8px 25px rgba(0,0,0,0.25);
}

.class-event{
  background:
  linear-gradient(
    135deg,
    rgba(59,130,246,0.9),
    rgba(99,102,241,0.9)
  );
}

.homework-event{
  background:
  linear-gradient(
    135deg,
    rgba(16,185,129,0.9),
    rgba(5,150,105,0.9)
  );
}

.test-event{
  background:
  linear-gradient(
    135deg,
    rgba(239,68,68,0.92),
    rgba(220,38,38,0.92)
  );
}

.busy-event{
  background:
  linear-gradient(
    135deg,
    rgba(245,158,11,0.92),
    rgba(217,119,6,0.92)
  );
}

.event-title{
  font-weight:700;
  font-size:0.9rem;
}

.event-sub{
  font-size:0.72rem;
  opacity:0.85;
  margin-top:4px;
}

/* SETUP */

.setup{
  position:fixed;

  inset:0;

  background:#020617;

  z-index:9999;

  overflow:auto;

  padding:40px;
}

.setup-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.hidden{
  display:none;
}

@media(max-width:1100px){

  .main{
    grid-template-columns:1fr;
  }

  .sidebar{
    height:auto;
  }
}

</style>
</head>
<body>

<!-- SETUP -->

<div class="setup hidden" id="setup">

  <h1 style="margin-bottom:10px;">
    Setup Your Schedule
  </h1>

  <div class="subtitle" style="margin-bottom:30px;">
    Configure your A Day and B Day classes.
  </div>

  <div class="setup-grid">

    <div class="card">

      <div class="section-title">
        A Day
      </div>

      <select id="a1"></select>
      <select id="a2"></select>
      <select id="a3"></select>
      <select id="a4"></select>

    </div>

    <div class="card">

      <div class="section-title">
        B Day
      </div>

      <select id="b1"></select>
      <select id="b2"></select>
      <select id="b3"></select>
      <select id="b4"></select>

    </div>

  </div>

  <div style="margin-top:20px;">
    <button onclick="saveSchedule()">
      Finish Setup
    </button>
  </div>

</div>

<!-- TOP -->

<div class="topbar">

  <div>

    <div class="logo">
      StudyFlow
    </div>

    <div class="subtitle">
      AI Homework Planner
    </div>

  </div>

  <div class="today" id="todayText"></div>

</div>

<!-- MAIN -->

<div class="main">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="card">

      <div class="section-title">
        Add Assignment
      </div>

      <input
        id="title"
        placeholder="Assignment Title"
      >

      <select id="class"></select>

      <select id="type">
        <option>Homework</option>
        <option>Project</option>
        <option>Essay</option>
        <option>Quiz</option>
        <option>Test</option>
        <option>Studying</option>
        <option>Other</option>
      </select>

      <input
        type="date"
        id="assigned"
      >

      <input
        type="date"
        id="due"
      >

      <input
        type="number"
        id="hours"
        placeholder="Estimated Hours"
      >

      <button onclick="addAssignment()">
        Add Assignment
      </button>

    </div>

    <div class="card">

      <div class="section-title">
        Add Busy Time
      </div>

      <input
        id="busyTitle"
        placeholder="Activity"
      >

      <select id="repeat">
        <option>One Time</option>
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <input
        type="datetime-local"
        id="busyStart"
      >

      <input
        type="datetime-local"
        id="busyEnd"
      >

      <button onclick="addBusy()">
        Add Busy Time
      </button>

    </div>

  </div>

  <!-- WEEK -->

  <div class="week-container">

    <div class="week-grid" id="weekGrid">

    </div>

  </div>

</div>

<script>

const classes = [
  "Math",
  "English",
  "History",
  "Theatre",
  "Spanish",
  "Health/Fitness",
  "Elective",
  "Science",
  "Study Hall",
  "Other"
];

const classSelect =
document.getElementById("class");

classes.forEach(c=>{

  classSelect.innerHTML += `
    <option>${c}</option>
  `;

});

[
"a1","a2","a3","a4",
"b1","b2","b3","b4"
].forEach(id=>{

  const el =
  document.getElementById(id);

  classes.forEach(c=>{

    el.innerHTML += `
      <option>${c}</option>
    `;

  });

});

let assignments =
JSON.parse(
localStorage.getItem("assignments")
) || [];

let busy =
JSON.parse(
localStorage.getItem("busy")
) || [];

let schedule =
JSON.parse(
localStorage.getItem("schedule")
);

if(!schedule){

  document
  .getElementById("setup")
  .classList.remove("hidden");

}

function saveSchedule(){

  schedule = {

    A:[
      a1.value,
      a2.value,
      a3.value,
      a4.value
    ],

    B:[
      b1.value,
      b2.value,
      b3.value,
      b4.value
    ]
  };

  localStorage.setItem(
    "schedule",
    JSON.stringify(schedule)
  );

  document
  .getElementById("setup")
  .classList.add("hidden");

  renderWeek();

}

function addAssignment(){

  assignments.push({

    title:title.value,

    className:
    document.getElementById("class").value,

    type:type.value,

    assigned:assigned.value,

    due:due.value,

    hours:hours.value

  });

  localStorage.setItem(
    "assignments",
    JSON.stringify(assignments)
  );

  renderWeek();

}

function addBusy(){

  busy.push({

    title:busyTitle.value,

    repeat:repeat.value,

    start:busyStart.value,

    end:busyEnd.value

  });

  localStorage.setItem(
    "busy",
    JSON.stringify(busy)
  );

  renderWeek();

}

function getSchoolDayIndex(date){

  let start =
  new Date();

  start.setHours(0,0,0,0);

  let count = 0;

  let current =
  new Date(start);

  while(current < date){

    current.setDate(
      current.getDate()+1
    );

    if(
      current.getDay() !== 0 &&
      current.getDay() !== 6
    ){

      count++;

    }
  }

  return count;

}

function getABDay(date){

  return
  getSchoolDayIndex(date)%2===0
  ? "A"
  : "B";

}

const classTimes = [

  {
    start:8,
    end:9.38
  },

  {
    start:9.38,
    end:10.83
  },

  {
    start:12,
    end:13.38
  },

  {
    start:13.38,
    end:14.83
  }

];

function renderWeek(){

  const grid =
  document.getElementById("weekGrid");

  grid.innerHTML = "";

  let monday =
  new Date();

  while(monday.getDay() !== 1){

    monday.setDate(
      monday.getDate()-1
    );

  }

  for(let i=0;i<5;i++){

    const date =
    new Date(monday);

    date.setDate(
      monday.getDate()+i
    );

    const ab =
    getABDay(date);

    const day =
    document.createElement("div");

    day.className = "day";

    if(
      date.toDateString() ===
      new Date().toDateString()
    ){

      day.classList.add(
        "today-day"
      );

    }

    day.innerHTML = `

      <div class="day-header">

        <div class="day-name">
          ${date.toLocaleDateString(
            "en-US",
            {weekday:"long"}
          )}
        </div>

        <div class="ab-day">
          ${ab} Day
        </div>

      </div>

      <div class="timeline">

      </div>

    `;

    grid.appendChild(day);

    const timeline =
    day.querySelector(".timeline");

    /* HOURS */

    for(let h=8; h<=24; h++){

      const row =
      document.createElement("div");

      row.className = "hour-row";

      const label =
      h===24
      ? "12 AM"
      : h>12
      ? `${h-12} PM`
      : `${h} AM`;

      row.innerHTML = `

        <div class="hour-label">
          ${label}
        </div>

        <div class="hour-line"></div>

      `;

      timeline.appendChild(row);

    }

    /* CLASSES */

    schedule[ab]
    .forEach((cls,index)=>{

      const t =
      classTimes[index];

      const block =
      document.createElement("div");

      block.className =
      "event class-event";

      block.style.top =
      `${(t.start-8)*80}px`;

      block.style.height =
      `${(t.end-t.start)*80}px`;

      block.innerHTML = `

        <div class="event-title">
          ${cls}
        </div>

        <div class="event-sub">
          Class Block
        </div>

      `;

      timeline.appendChild(block);

    });

    /* ASSIGNMENTS */

    assignments.forEach(a=>{

      if(
        a.due ===
        date
        .toISOString()
        .split("T")[0]
      ){

        const hw =
        document.createElement("div");

        let typeClass =
        "homework-event";

        if(
          a.type==="Test" ||
          a.type==="Quiz"
        ){

          typeClass =
          "test-event";

        }

        hw.className =
        `event ${typeClass}`;

        hw.style.top = "620px";
        hw.style.height = "75px";

        hw.innerHTML = `

          <div class="event-title">
            ${a.title}
          </div>

          <div class="event-sub">
            ${a.className}
            • ${a.type}
          </div>

        `;

        timeline.appendChild(hw);

      }

    });

  }

}

document
.getElementById("todayText")
.innerHTML = `

  ${new Date()
  .toLocaleDateString(
    "en-US",
    {
      weekday:"long",
      month:"long",
      day:"numeric"
    }
  )}

`;

if(schedule){

  renderWeek();

}

</script>

</body>
</html>
