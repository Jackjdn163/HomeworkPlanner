<!DOCTYPE html>
      <select id="type" onchange="updateDateFields()">
        <option>Homework</option>
        <option>Project</option>
        <option>Essay</option>
        <option>Quiz</option>
        <option>Test</option>
        <option>Studying</option>
        <option>Other</option>
      </select>

      <div id="assignedWrapper">
        <label>Assigned Date</label>
        <input type="date" id="assigned" />
      </div>

      <label>Due Date</label>
      <input type="date" id="due" />

      <input type="number" id="hours" placeholder="Estimated Hours" />

      <button onclick="addAssignment()">Add Assignment</button>
    </div>

    <div class="card">
      <div class="section-title">Add Busy Time</div>

      <input id="busyTitle" placeholder="Activity" />

      <select id="repeat">
        <option>One Time</option>
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <label>Day</label>
      <input type="date" id="busyDate" />

      <label>Start Time</label>
      <input type="time" id="busyStart" />

      <label>End Time</label>
      <input type="time" id="busyEnd" />

      <button onclick="addBusy()">Add Busy Time</button>
    </div>

  </div>

  <div class="week-container">
    <div class="week-grid" id="weekGrid"></div>
  </div>

</div>

<script src="js/storage.js"></script>
<script src="js/schedule.js"></script>
<script src="js/assignments.js"></script>
<script src="js/busy.js"></script>
<script src="js/rendering.js"></script>
<script src="js/calendar.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>

</body>
</html>
